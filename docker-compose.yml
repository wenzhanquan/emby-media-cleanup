services:
  cleanup:
    image: ${IMAGE:-ghcr.io/wenzhanquan/emby-media-cleanup:latest}
    container_name: emby-media-cleanup
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: Asia/Shanghai
      IMMORTAL_CONTAINER: ${IMMORTAL_CONTAINER:-immortal}
      EMBY_LIBRARY_PATH: ${EMBY_LIBRARY_PATH:-/media/strm/小姐姐}
      # 0=周一，6=周日；修改后重新部署容器生效。
      CLEANUP_WEEKDAY: "${CLEANUP_WEEKDAY:-6}"
      CLEANUP_HOUR: "${CLEANUP_HOUR:-4}"
      CLEANUP_MINUTE: "${CLEANUP_MINUTE:-30}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${HOST_DATA_ROOT:?set HOST_DATA_ROOT in .env}:/nas-data:rslave
      - ${MDC_DATA_DIR:?set MDC_DATA_DIR in .env}:/config:ro
      - ${AUDIT_DIR:?set AUDIT_DIR in .env}:/audit
      - ./state:/state
    healthcheck:
      test: ["CMD", "python", "/opt/media-cleanup/healthcheck.py"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      retries: 3
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      description: "Emby 大姐姐库每周清理：保护 Immortal 订阅演员，排除 VR"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
